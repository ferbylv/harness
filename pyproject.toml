[project]
name = "agent-harness"
version = "0.1.0"
description = "A small, extendable coding-agent harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "吕洋" }]
keywords = ["coding-agent", "llm", "harness", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "textual>=0.86",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = ["mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://ferbylv.github.io/harness/"
Documentation = "https://ferbylv.github.io/harness/"
Repository = "https://github.com/ferbylv/harness"
Issues = "https://github.com/ferbylv/harness/issues"
Changelog = "https://github.com/ferbylv/harness/blob/main/STATUS.md"

[project.scripts]
harness = "harness.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
