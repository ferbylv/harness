site_name: harness
site_description: 一个能跑起来的 coding agent 骨架
site_author: 吕洋
repo_url: https://github.com/ferbylv/harness
repo_name: ferbylv/harness
site_url: https://ferbylv.github.io/harness/
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 harness contributors

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 浅色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: 深色
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首页: index.md
  - 指南:
      - 快速开始: getting-started.md
      - 使用: usage.md
      - 配置: config.md
  - 架构:
      - 设计: architecture.md
      - 扩展: extending.md
      - 前端协议: ui.md
  - 现状: status.md
  - 发布文档站: publishing.md
